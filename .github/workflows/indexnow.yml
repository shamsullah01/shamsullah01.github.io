# After GitHub Pages finishes deploying, tell IndexNow search engines (Bing, Yandex, Seznam, Naver...)
# about every URL in sitemap.xml so new and changed pages are crawled within hours.
name: IndexNow ping

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      HOST: shamsullah01.github.io
      KEY: 87500dfd340093bd80f7da45838633c9
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -s .)
          echo "Submitting $(echo "$urls" | jq length) URLs"
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls"             '{host:$host, key:$key, keyLocation:("https://"+$host+"/"+$key+".txt"), urlList:$urls}')
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow             -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow HTTP $code"; cat resp.txt || true
          # 200 = accepted, 202 = accepted (key pending verification)
          [ "$code" = "200" ] || [ "$code" = "202" ]
